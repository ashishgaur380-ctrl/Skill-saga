name: Inject curriculum hierarchy v1
on:
  push:
    branches: [final-integration]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject curriculum layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html'); s=p.read_text(); marker='</body>'
          tag='<script src="curriculum-hierarchy-v1.js"></script>'
          if tag not in s:
              i=s.rfind(marker)
              if i<0: raise SystemExit('No </body> found')
              s=s[:i]+'\n'+tag+'\n'+s[i:]
              p.write_text(s)
          PY
      - name: Commit injected index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          git diff --cached --quiet || git commit -m 'Inject curriculum hierarchy layer [skip curriculum injection]'
          git push
