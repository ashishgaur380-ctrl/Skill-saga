name: Inject content integration v3
on:
  push:
    branches: [final-integration]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-integration
          fetch-depth: 0
      - name: Inject content scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          marker='</body>'
          if marker not in s:
              raise SystemExit('No closing body tag found; aborting safely')
          tags=['<script src="admin-test-seed.js"></script>','<script src="final-content-actions-v3.js"></script>']
          for tag in tags:
              if tag not in s:
                  s=s.replace(marker, tag+'\n'+marker, 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit injection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Inject content integration v3 [skip content v3]"
          git push origin final-integration
