name: Inject Skill Saga account fix v2
on:
  push:
    branches: [final-integration]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-integration
          fetch-depth: 0
      - name: Inject account patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="final-account-fix-v2.js"></script>'
          if marker not in s:
              pos=s.rfind('</body>')
              if pos < 0: raise SystemExit('No body close tag')
              s=s[:pos]+marker+'\n'+s[pos:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Inject account fix v2 [skip account-fix]"
          git push origin HEAD:final-integration
