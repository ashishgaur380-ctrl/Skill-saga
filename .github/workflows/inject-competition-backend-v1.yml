name: Inject Skill Saga competition backend v1
on:
  push:
    branches: [final-integration]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-integration
          fetch-depth: 0
      - name: Inject competition backend script
        shell: bash
        run: |
          set -euo pipefail
          file="app/src/main/assets/index.html"
          marker='<script src="competition-backend-v1.js"></script>'
          grep -q 'competition-backend-v1.js' "$file" && exit 0
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="competition-backend-v1.js"></script>'
          pos=s.rfind('</body>')
          if pos < 0: raise SystemExit('No </body> found; refusing unsafe injection')
          s=s[:pos]+marker+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit injection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Inject competition backend v1 [skip competition-backend]"
          git push origin HEAD:final-integration
