name: Inject Teacher Parent Assignments v1
on:
  workflow_dispatch:
  push:
    branches: [final-integration]
    paths:
      - 'app/src/main/assets/teacher-parent-assignments-v1.js'
      - 'app/src/main/assets/index.html'
jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject assignment script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text()
          tag='<script src="teacher-parent-assignments-v1.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>',1)
              p.write_text(s)
          PY
      - name: Commit injection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          git diff --cached --quiet || git commit -m 'Inject teacher parent assignments v1'
          git push
