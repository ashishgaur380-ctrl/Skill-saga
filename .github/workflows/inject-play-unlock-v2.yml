name: Inject Skill Saga Play unlock bridge
on:
  push:
    branches: [final-integration]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html'); s=p.read_text()
          tag='<script src="play-unlock-v2.js"></script>'
          if tag not in s:
              i=s.rfind('</body>')
              if i<0: raise SystemExit('No </body> found')
              s=s[:i]+tag+'\n'+s[i:]; p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          git diff --cached --quiet || git commit -m 'Inject Play unlock bridge [skip unlock v2]'
          git push