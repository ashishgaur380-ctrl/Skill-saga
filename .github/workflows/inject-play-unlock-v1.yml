name: Inject Skill Saga Play unlock v1
on:
  push:
    branches: [final-integration]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject unlock layer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="play-unlock-v1.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('index.html has no </body> marker')
              s=s.replace(marker, tag+marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit injected file
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Inject Play class unlock layer [skip play unlock v1]'
          git push