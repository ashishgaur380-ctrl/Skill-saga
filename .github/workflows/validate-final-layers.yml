name: Validate Skill Saga final layers
on:
  push:
    branches: [final-integration]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate asset JavaScript
        run: |
          set -e
          for f in app/src/main/assets/*.js; do
            echo "Checking $f"
            node --check "$f"
          done