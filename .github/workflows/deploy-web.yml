name: Deploy Skill Saga Web
# Final learner UI deployment pipeline — UI files are copied unchanged.
# Deployment refresh marker: 2026-09-19-LEARNER-NAV-FINAL

on:
  push:
    branches: [main, final-integration, skill-saga-clean-rebuild]
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch to deploy for testing (leave blank to use main)"
        required: false
        default: "main"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_branch || github.ref }}

      - name: Prepare web site
        run: |
          rm -rf web-dist
          mkdir -p web-dist
          cp -R app/src/main/assets/. web-dist/
          touch web-dist/.nojekyll
          echo "Prepared $(find web-dist -type f | wc -l) web files"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web-dist

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Admin-only deployment trigger; learner assets are copied unchanged.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
