name: Deploy Skill Saga Web

on:
  push:
    branches: [main, final-integration, admin-learn-control-v1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare web site
        run: |
          rm -rf web-dist
          mkdir -p web-dist
          cp -R app/src/main/assets/. web-dist/
          touch web-dist/.nojekyll
          echo "Prepared $(find web-dist -type f | wc -l) web files"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist

  deploy:
    environment:
      name: skillsaga-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Admin-only deployment trigger; learner assets are copied unchanged.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
