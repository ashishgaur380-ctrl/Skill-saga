name: Deploy Skill Saga Web

on:
  push:
    branches: [main, final-integration]
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch to deploy for testing (leave blank to use main)"
        required: false
        default: "main"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_branch || github.ref }}

      - name: Prepare web site
        run: |
          chmod +x web/build-web.sh
          bash web/build-web.sh
          rm -rf web-dist
          mkdir -p web-dist
          cp -R web/public/. web-dist/
          touch web-dist/.nojekyll
          echo "Prepared $(find web-dist -type f | wc -l) web files"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
