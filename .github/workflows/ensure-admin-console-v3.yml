name: Ensure Admin Console v3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ensure-admin-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Admin Console v3 script is loaded
        shell: bash
        run: |
          set -e
          FILE="app/src/main/assets/index.html"
          if grep -Eq '<script src="admin-console-v3\.js([?"][^>]*)></script>' "$FILE"; then
            echo "Admin Console v3 already loaded."
            exit 0
          fi
          TAG='<script src="admin-console-v3.js"></script>'
          printf '\n%s\n' "$TAG" >> "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Load Admin Console v3 in app shell"
          git push
