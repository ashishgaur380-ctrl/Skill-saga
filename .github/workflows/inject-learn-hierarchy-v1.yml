name: Inject Learn hierarchy v1
on:
  push:
    branches: [final-integration]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-integration
          fetch-depth: 0
      - name: Inject Learn script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="final-learn-hierarchy-v1.js"></script>'
          if tag not in s:
              if '</body>' not in s: raise SystemExit('No closing body tag')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Inject Learn hierarchy v1 [skip learn v1]"
          git push origin final-integration
