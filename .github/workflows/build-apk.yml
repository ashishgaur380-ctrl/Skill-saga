name: Build Skill Saga APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Skill Saga project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No Skill Saga ZIP found in repository root."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf buildsrc
          mkdir -p buildsrc

          unzip -q "$ZIP_FILE" -d buildsrc

          PROJECT_DIR=$(find buildsrc -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found inside ZIP."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$
