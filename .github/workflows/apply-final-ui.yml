name: Apply Skill Saga Final UI

on:
  push:
    branches: [final-ui-integration]

permissions:
  contents: write

jobs:
  integrate:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: final-ui-integration
          fetch-depth: 0
      - name: Inject final UI script
        run: python3 scripts/inject-final-ui.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/index.html
          if git diff --cached --quiet; then
            echo "No integration change required"
          else
            git commit -m "Integrate finalized learner UI [skip ci]"
            git push origin final-ui-integration
          fi
