  return d.toISOString().slice(0,10);
}

function getAdaptiveDifficulty(skill,topic){
var u=user();
var key=(skill||'General')+'|'+(topic||'General');
var m=(u.mastery||{})[key];

if(!m)return 'Easy';

var accuracy=Number(m.lastAccuracy||m.accuracy||0);
var mastery=Number(m.mastery||0);
var score=Math.round((accuracy*0.6)+(mastery*0.4));

if(score<40)return 'Easy';
if(score<60)return 'Medium';
if(score<80)return 'Medium';
if(score<90)return 'Hard';
return 'Hard';
}

function getUnlockedLevels(skill,topic){
var u=user();
var key=(skill||'General')+'|'+(topic||'General');
var m=(u.mastery||{})[key];
var mastery=m?Number(m.mastery||0):0;
var attempts=m?Number(m.attempts||0):0;

var unlocked=['Basic'];

if(attempts>=1 && mastery>=40)unlocked.push('Foundation');
if(attempts>=2 && mastery>=60)unlocked.push('Intermediate');
if(attempts>=3 && mastery>=75)unlocked.push('Advanced');
if(attempts>=4 && mastery>=90)unlocked.push('Expert');

return unlocked;
}

function quizBrowser(category,skill,topic){
var me=user();
var studentClass=me&&me.studentClass?String(me.studentClass):'All';
var list=Array.isArray(local.content)?local.content:[];
var matches=list.filter(function(q){
if(q.published===false)return false;
if(q.category!==category)return false;
var qClass=q.classLevel||'All';
if(qClass!=='All'&&studentClass!=='All'&&String(qClass)!==studentClass)return false;
if(skill&&(q.skill||'General')!==skill)return false;
if(topic&&(q.topic||'General')!==topic)return false;
return true;
});
if(!matches.length)return toast('No quiz is available for this selection yet');

var adaptiveDifficulty=(skill&&topic)?getAdaptiveDifficulty(skill,topic):'';
if(adaptiveDifficulty){
var preferred=matches.filter(function(q){
return String(q.difficulty||'').toLowerCase()===adaptiveDifficulty.toLowerCase();
});
if(preferred.length)matches=preferred;
}

var skills=[...new Set(matches.map(function(q){return q.skill||'General'}))];
var topics=[...new Set(matches.filter(function(q){return !skill||q.skill===skill}).map(function(q){return q.topic||'General'}))];
var levels=[...new Set(matches.filter(function(q){return !skill||q.skill===skill}).filter(function(q){return !topic||q.topic===topic}).map(function(q){return q.level||'Foundation'}))];

if(!skill){
shell('<div class="row"><button class="back" onclick="play()">‹</button><div><h1 style="margin:0">'+esc(category)+'</h1><div class="muted">Choose a skill</div></div></div><div class="grid" style="margin-top:18px">'+skills.map(function(x){return '<div class="tile" onclick="quizBrowser(\''+category.replace(/'/g,"\\'")+'\',\''+x.replace(/'/g,"\\'")+'\')"><span class="ico">🎯</span><b>'+esc(x)+'</b><small>Practice</small></div>'}).join('')+'</div>');
return;
}

if(!topic){

function leaderboard(arr){
  var me=user();
  var list=(arr||[]).slice().sort(function(a,b){
    return (b.xp||0)-(a.xp||0);
  });

  var myIndex=-1;
  if(me){
    myIndex=list.findIndex(function(x){
      return (x.uid&&cloudUser&&x.uid===cloudUser.uid) ||
             (x.email&&x.email===me.email);
    });
  }

  var rows=list.slice(0,10).map(function(u,i){
    var medal=i===0?'🥇':(i===1?'🥈':(i===2?'🥉':String(i+1)));
    var mine=me && u.email===me.email;

    return '<tr style="'+(mine?'font-weight:700;background:#fff8df':'')+'">'+
      '<td>'+medal+'</td>'+
      '<td>'+esc(u.name||'Learner')+(mine?' <span class="badge">You</span>':'')+'</td>'+

      '<td>'+(u.xp||0)+'</td>'+
      '<td>🔥 '+(u.streak||0)+'</td>'+
    '</tr>';
  }).join('');

  if(!rows){
    rows='<tr><td colspan="5" class="center muted">No leaderboard data yet.</td></tr>';
  }

  var myRank='';
  if(myIndex>=0){
    myRank='<div class="notice">🏆 Your current rank: <b>#'+(myIndex+1)+'</b> • '+(me.xp||0)+' XP</div>';
  }

  return '<div class="card">'+
    '<table class="table">'+
      '<tr><th>#</th><th>Learner</th><th>Level</th><th>XP</th><th>Streak</th></tr>'+
      rows+
    '</table>'+
    myRank+
  '</div>';
}


function skills(){
let u=user();
let names=['Numerical','Reasoning','Problem Solving','Speed','Accuracy','Memory','Vocabulary','Scientific Thinking'];
let vals=[u.skills[0],u.skills[3],u.skills[0],u.skills[3],u.accuracy,u.skills[2],u.skills[1],u.skills[2]];

var mastery=Object.values(u.mastery||{});
var dna={};

mastery.forEach(function(m){
  var key=m.skill||'General';
  if(!dna[key])dna[key]={total:0,count:0,best:0,improvement:0};
  dna[key].total+=Number(m.mastery||0);
  dna[key].count++;
  dna[key].best=Math.max(dna[key].best,Number(m.best||0));
  dna[key].improvement+=Number(m.improvement||0);
});

var dnaRows=Object.keys(dna).map(function(key){
  var score=Math.round(dna[key].total/dna[key].count);
  return {name:key,score:score,best:dna[key].best,improvement:dna[key].improvement};
}).sort(function(a,b){return b.score-a.score;});

var strongest=dnaRows.length?dnaRows[0]:null;
var growing=dnaRows.slice().sort(function(a,b){return b.improvement-a.improvement})[0];
var needs=dnaRows.length?dnaRows[dnaRows.length-1]:null;

var masteryHtml=dnaRows.length
  ? dnaRows.map(function(x){
      return '<div style="margin:13px 0">'+
        '<div class="row"><b>'+esc(x.name)+'</b><span class="badge">'+x.score+'%</span></div>'+
        '<div class="bar" style="margin-top:6px"><i style="width:'+Math.max(0,Math.min(100,x.score))+'%"></i></div>'+
        '<div class="muted" style="font-size:11px;margin-top:4px">Best '+x.best+'% • Improvement '+(x.improvement>0?'+':'')+x.improvement+'%</div>'+
      '</div>';
    }).join('')
  : '<p class="muted">Complete categorized quizzes to build your Skill DNA.</p>';

var summaryHtml=dnaRows.length
  ? '<div class="grid" style="margin-top:15px">'+
      '<div class="tile"><span class="ico">💪</span><b>'+esc(strongest.name)+'</b><small>Strongest • '+strongest.score+'%</small></div>'+
      '<div class="tile"><span class="ico">📈</span><b>'+esc(growing.name)+'</b><small>Growing fastest</small></div>'+
      '<div class="tile"><span class="ico">🎯</span><b>'+esc(needs.name)+'</b><small>Needs practice</small></div>'+
    '</div>'
  : '';

shell(`<h1>My Skill DNA</h1>
<div class="muted">Your skills change as you learn and practice.</div>
${summaryHtml}
<div class="card" style="margin-top:15px">
  <b>Skill Mastery</b>
  ${masteryHtml}
</div>
<div class="section"><b>Core Skill Scores</b></div>
<div class="card">${names.map((n,i)=>`<div style="margin:12px 0"><div class="row"><span>${n}</span><b>${vals[i]}</b></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,vals[i]||0))}%"></i></div></div>`).join('')}</div>
<div class="section"><b>Achievements & Rewards</b></div>
<div class="card">${u.badges.length?u.badges.map(x=>`<span class="badge">🏅 ${esc(x)}</span>`).join(''):'<span class="muted">Complete challenges to unlock badges.</span>'}</div>
<button class="btn gold block" onclick="rewardsScreen()">Open Rewards</button>`);
}

async function claimReward(name,cost){
  var u=ensureUserData(user());

  if(u.badges.includes(name)){
    return toast('Already unlocked');
  }

  if(cost>0 && (u.coins||0)<cost){
    return toast('Not enough Skill Saga Coins yet');
  }

  if(cost>0)u.coins-=cost;

  u.badges.push(name);
  await persistUser(u);

  toast('🏅 Achievement unlocked!');
  rewardsScreen();
}

async function respondLinkRequest(requestId,action){
  var u=user();
  if(!u||u.role!=='learner'||!cloudDb)return toast('Only learners can respond to requests');

  try{
    var ref=cloudDb.collection('linkRequests').doc(requestId);
    var snap=await ref.get();
    if(!snap.exists)return toast('Link request not found');

    var req=snap.data();
    if(req.toUid!==cloudUser.uid||req.status!=='pending')return toast('This request is no longer available');

    if(action==='rejected'){
      await ref.update({
        status:'rejected',
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      toast('Link request rejected');
      return notifications();
    }

    var linked={
      uid:req.fromUid,
      name:req.fromName||req.fromEmail||'Parent/Teacher',
      email:req.fromEmail||'',
      role:req.fromRole||'parent'
    };

    ensureUserData(u);

    if(req.fromRole==='parent'){
      u.linkedParents=u.linkedParents.filter(function(x){return x.uid!==req.fromUid});
      u.linkedParents.push(linked);
    }else if(req.fromRole==='teacher'){
      u.linkedTeachers=u.linkedTeachers.filter(function(x){return x.uid!==req.fromUid});
      u.linkedTeachers.push(linked);
    }

    await persistUser(u);

    var relationshipId=req.fromUid+'_'+cloudUser.uid;
    var relationship={
      studentUid:cloudUser.uid,
      studentName:u.name||u.email||'Student',
      studentEmail:u.email||'',
      status:'active',
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    };

    if(req.fromRole==='parent'){
      relationship.parentUid=req.fromUid;
      relationship.parentName=req.fromName||req.fromEmail||'Parent';
      relationship.parentEmail=req.fromEmail||'';
    }else if(req.fromRole==='teacher'){
      relationship.teacherUid=req.fromUid;
      relationship.teacherName=req.fromName||req.fromEmail||'Teacher';
      relationship.teacherEmail=req.fromEmail||'';
    }

    await cloudDb.collection('relationships').doc(relationshipId).set(relationship,{merge:true});

    await ref.update({
      status:'accepted',
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });

    toast('Link request accepted');
    notifications();
  }catch(e){
    console.warn('Link response failed',e);
    toast('Unable to respond to request');
  }
}

async function publishQuiz(){
  try{
    var title=document.getElementById('qt').value.trim();
    var cat=document.getElementById('qc').value.trim()||'General';
    var type=document.getElementById('qtype').value||'daily';
    var difficulty=document.getElementById('qdiff').value||'Medium';
    var date=document.getElementById('qd').value||new Date().toISOString().slice(0,10);
    var xp=Math.max(10,Math.min(500,Number(document.getElementById('qx').value)||100));

    var raw=document.getElementById('qq').value.split('\n')
      .map(function(x){return x.trim()})
      .filter(Boolean);

    if(!title)return toast('Enter a quiz title');
    if(!raw.length)return toast('Add at least one question');

    var qs=[];
    for(var i=0;i<raw.length;i++){
      try{
        var q=JSON.parse(raw[i]);
        if(!Array.isArray(q)||q.length!==3||typeof q[0]!=='string'||
           !Array.isArray(q[1])||q[1].length!==4||
           ![0,1,2,3].includes(q[2])){
          throw Error();
        }
        qs.push(q);
      }catch(e){
        return toast('Invalid question on line '+(i+1));
      }
    }

    if(!cloudDb||!cloudUser){
      return toast('Admin database is not connected');
    }

    var doc={
      type:type,
      title:title,
      category:cat,
      classLevel:(document.getElementById('qclass')||{}).value||'All',
      skill:(document.getElementById('qskill')||{}).value.trim(),
      topic:(document.getElementById('qtopic')||{}).value.trim(),
      level:(document.getElementById('qlevel')||{}).value||'Foundation',
      difficulty:difficulty,
      xp:xp,
      date:date,
      published:true,
      questions:qs,
      createdBy:cloudUser.uid,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    };

    await cloudDb.collection('quizzes').add(doc);
    await loadCloudContent();

    toast('Quiz published successfully');
    admin();

  }catch(e){
    toast(e.message||'Could not publish quiz');
  }
}

async function assignQuizToStudent(studentUid,quizId){
  var u=user();
  if(!u||u.role!=='teacher')return toast('Only teachers can assign quizzes');
  if(!cloudDb||!cloudUser)return toast('Firebase is not connected');
  if(!studentUid||!quizId)return toast('Invalid assignment');

  var student=(Array.isArray(u.linkedStudents)?u.linkedStudents:[]).find(function(x){return x.uid===studentUid;});
  if(!student)return toast('Student is not linked to this teacher');

  var quiz=(Array.isArray(local.content)?local.content:[]).find(function(q){return q.id===quizId;});
  if(!quiz)return toast('Quiz not found');

  try{
    var assignmentId=cloudUser.uid+'_'+studentUid+'_'+quizId;
    var ref=cloudDb.collection('assignments').doc(assignmentId);
    var existing=await ref.get();

    if(existing.exists&&existing.data().status!=='completed'){
      return toast('This quiz is already assigned');
    }

    await ref.set({
      teacherUid:cloudUser.uid,
      teacherName:u.name||u.email||'Teacher',
      studentUid:studentUid,
      studentName:student.name||'Student',
      quizId:quizId,
      quizTitle:quiz.title||'Quiz',
      category:quiz.category||'',
      skill:quiz.skill||'',
      topic:quiz.topic||'',
      difficulty:quiz.difficulty||'Medium',
      status:'assigned',
      assignedAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    },{merge:true});

    toast('Quiz assigned successfully');
    teacherAssignments();
  }catch(e){
    console.warn('Quiz assignment failed',e);
    toast(e.message||'Unable to assign quiz');
  }
}

async function syncRelationships(){
  var u=user();
  if(!u||!['parent','teacher'].includes(u.role)||!cloudDb)return u;
  ensureUserData(u);

  try{
    var field=u.role==='parent'?'parentUid':'teacherUid';
    var snap=await cloudDb.collection('relationships')
      .where(field,'==',cloudUser.uid)
      .where('status','==','active')
      .get();

    var links=snap.docs.map(function(d){
      var r=d.data();
      return {
        uid:r.studentUid,
        name:r.studentName||'Student',
        email:r.studentEmail||'',
        xp:0,
        level:1,
        accuracy:0,
        quizzes:0,
        streak:0,
        coins:0,
        mastery:{},
        skills:[50,50,50,50]
      };
    });

    if(links.length){
      u.linkedStudents=links;
      local.user=u;
      writeLocal(u);
    }
  }catch(e){
    console.warn('Relationship sync failed',e);
  }

  return u;
}

async function refreshLinkedStudents(){
  var u=user();
  if(!u||!['parent','teacher'].includes(u.role))return u;
  ensureUserData(u);
  return await syncRelationships();
}

async function linkStudentByEmail(){
  var u=user();
  if(!u||!['parent','teacher'].includes(u.role))return toast('Only parent or teacher accounts can link students');

  var input=document.getElementById('linkStudentEmail');
  var code=input?input.value.trim().toUpperCase():'';
  if(!code)return toast('Enter the student link code');

  if(!cloudDb)return toast('Firebase is not connected');

  try{
    var snap=await cloudDb.collection('studentDirectory').doc(code).get();

    if(!snap.exists)return toast('Student link code not found');

    var student=snap.data();
    var studentUid=student.studentUid;
    if(!studentUid)return toast('Invalid student link code');

    var requestId=u.uid+'_'+studentUid;
    var requestRef=cloudDb.collection('linkRequests').doc(requestId);
    var existing=await requestRef.get();

    if(existing.exists){
      var existingData=existing.data();
      if(existingData.status==='pending')return toast('Link request already pending');
      if(existingData.status==='accepted')return toast('Student already linked');
    }

    await requestRef.set({
      fromUid:u.uid,
      fromRole:u.role,
      fromName:u.name||u.email,
      fromEmail:u.email,
      toUid:studentUid,
      toName:student.name||student.email||'Student',
      toEmail:student.email||'',
      status:'pending',
      createdAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });

    if(input)input.value='';
    toast('Link request sent to student');
  }catch(e){
    console.warn('Link request failed',e);
    toast('Unable to send link request');
  }
}

<script>
/* ===== SKILL SAGA FINAL CORE UPGRADE ===== */
(function(){

window.skillSagaRewards=[
 {id:"first",name:"First Step",cost:0,icon:"🌟",desc:"Complete your first challenge"},
 {id:"streak7",name:"7 Day Streak",cost:500,icon:"🔥",desc:"Maintain a 7-day learning streak"},
 {id:"champion",name:"Quiz Champion",cost:1000,icon:"🏆",desc:"Complete quizzes and unlock the badge"},
 {id:"master",name:"Skill Master",cost:2500,icon:"🥇",desc:"Reach Skill Master level"},
 {id:"ebook",name:"Educational E-book",cost:5000,icon:"📚",desc:"Sponsored educational e-book when available"},
 {id:"stationery",name:"Stationery Reward",cost:10000,icon:"✏️",desc:"Sponsored stationery reward when available"}
];

function ssUser(){
 try{
   if(typeof user==="function") return user();
 }catch(e){}
 return window.local?.user || {};
}

async function ssSave(u){
 try{
   if(typeof persistUser==="function") await persistUser(u);
 }catch(e){}
 try{
   local.user=u;
   localStorage.setItem("skillSaga",JSON.stringify(local));
 }catch(e){}
}

window.addSkillSagaCoins=async function(amount){
 let u=ssUser();
 u.coins=Number(u.coins||0)+Number(amount||0);
 await ssSave(u);
};

window.addQuizHistory=async function(record){
 let u=ssUser();
 u.quizHistory=Array.isArray(u.quizHistory)?u.quizHistory:[];
 u.quizHistory.unshift({
   ...record,
   id:Date.now(),
   date:new Date().toISOString()
 });
 u.quizHistory=u.quizHistory.slice(0,100);
 await ssSave(u);
};

window.showQuizHistory=function(){
 let u=ssUser();
 let h=Array.isArray(u.quizHistory)?u.quizHistory:[];
 let html='<div class="card"><h2>📚 Quiz History</h2>';
 if(!h.length){
   html+='<p class="muted">No quizzes completed yet. Start your first challenge!</p>';
 }else{

   <div class="card" style="margin:10px 0;padding:14px">

     <div class="muted">${x.category||"General"} • ${x.score||0}/${x.total||0}</div>

};

window.showSkillSagaRewards=function(){
 let u=ssUser();
 let coins=Number(u.coins||0);
 let claimed=Array.isArray(u.claimedRewards)?u.claimedRewards:[];
 let html=`<div class="card"><h2>🪙 Skill Saga Coins</h2>
 <h1>${coins}</h1>
 <p class="muted">Earn coins by learning and completing challenges.</p></div>`;

      onclick="redeemSkillSagaReward('${r.id}')">
      ${done?"✓ Unlocked":(can?"Unlock":"Not enough Coins")}

   </div>`;
 }).join("");

 html+=`<div class="card">

 document.body.insertAdjacentHTML("beforeend",

};

window.redeemSkillSagaReward=async function(id){
 let u=ssUser();
 let r=window.skillSagaRewards.find(x=>x.id===id);
 if(!r)return;
 u.coins=Number(u.coins||0);
 u.claimedRewards=Array.isArray(u.claimedRewards)?u.claimedRewards:[];
 u.badges=Array.isArray(u.badges)?u.badges:[];

 if(u.claimedRewards.includes(id))return;
 if(u.coins<r.cost){
   if(typeof toast==="function")toast("Not enough Skill Saga Coins");
   return;
 }

 u.coins-=r.cost;
 u.claimedRewards.push(id);
 if(!u.badges.includes(r.name))u.badges.push(r.name);
 await ssSave(u);

 if(typeof toast==="function")toast("🎉 Reward unlocked!");
 document.getElementById("ssRewardsOverlay")?.remove();
 window.showSkillSagaRewards();
};

window.deleteSkillSagaAccount=async function(){
 let u=ssUser();
 if(!confirm("Delete your Skill Saga account permanently? This cannot be undone."))return;

 try{
   if(window.firebaseReady && firebase.auth().currentUser){
     let cu=firebase.auth().currentUser;
     try{
       await firebase.firestore().collection("users").doc(cu.uid).delete();
     }catch(e){}
     await cu.delete();
   }
 }catch(e){
   if(typeof toast==="function")toast("Please log in again before deleting your account.");
   return;
 }

 try{localStorage.removeItem("skillSaga");}catch(e){}
 if(typeof logout==="function"){
   try{await logout();return}catch(e){}
 }
 location.reload();
};

/* Migrate existing users without destroying their data */
try{
 let u=ssUser();
 if(u && typeof u==="object"){
   if(typeof u.coins!=="number")u.coins=0;
   if(!Array.isArray(u.quizHistory))u.quizHistory=[];
   if(!Array.isArray(u.claimedRewards))u.claimedRewards=[];
   if(!Array.isArray(u.badges))u.badges=[];
   ssSave(u);
 }
}catch(e){}

/* Add a visible history/rewards utility where possible */
window.openSkillSagaHistory=window.showQuizHistory;
window.openSkillSagaRewards=window.showSkillSagaRewards;

})();
</script>
