<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152f"><title>Skill Saga</title>

<style>
*{box-sizing:border-box}body{margin:0;background:#071127;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#14213d}.app{width:min(460px,100vw);min-height:100vh;margin:auto;background:#f7f9fd;padding-bottom:96px}.top{padding:calc(14px + env(safe-area-inset-top)) 17px 14px;display:flex;justify-content:space-between;align-items:center;background:#07152f;color:#fff;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:9px}.brand img{width:42px;height:42px;border-radius:12px;object-fit:cover}.brand b{font-size:20px}.brand b span{color:#e8b94f}.iconbtn{border:0;background:#ffffff12;color:#fff;border-radius:12px;padding:9px 11px}.main{padding:18px}.muted{color:#74819b;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat,.card,.tile{background:#fff;border-radius:18px;padding:15px;box-shadow:0 7px 24px #10204d12}.stat b{display:block;font-size:18px}.stat small{color:#7b88a0}.hero{background:linear-gradient(135deg,#0a2453,#1769ff 55%,#7047ef);color:#fff;border-radius:21px;padding:18px;margin:13px 0}.hero h2{margin:4px 0}.btn{border:0;border-radius:12px;padding:12px 17px;font-weight:850;cursor:pointer;background:#1769ff;color:#fff}.btn.gold{background:#e9b84d;color:#07152f}.btn.light{background:#fff;color:#1769ff}.btn.block{width:100%}.section{display:flex;justify-content:space-between;align-items:center;margin:19px 2px 9px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{cursor:pointer}.tile .ico{font-size:27px}.tile b{display:block;margin-top:6px}.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.skill{text-align:center;background:#fff;border-radius:14px;padding:11px 3px;font-size:11px}.skill b{display:block;font-size:15px}.bar{height:8px;background:#e7ebf4;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#1769ff}.nav{position:fixed;bottom:0;width:min(460px,100vw);height:82px;padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid #e9edf4;display:flex;justify-content:space-around;align-items:center;z-index:10}.nav button{border:0;background:none;color:#7d89a1;font-size:10px;font-weight:800;min-width:0;flex:1;padding:4px 0;overflow:hidden;text-align:center}.nav button.active{color:#1769ff}.nav span{display:block;font-size:18px;line-height:22px;white-space:normal;overflow:hidden;text-overflow:ellipsis}\n.nav button[data-s="compete"] span{font-size:9px;letter-spacing:-.2px}.option{display:block;width:100%;padding:14px;margin:8px 0;border:1px solid #dce3ef;background:#fff;border-radius:13px;text-align:left;font-weight:650;cursor:pointer}.option.ok{background:#e9faf3;border-color:#18b978}.option.no{background:#fff0f1;border-color:#ef5b62}.badge{display:inline-block;padding:7px 9px;border-radius:9px;background:#fff3ca;margin:3px;font-size:11px;font-weight:800}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.back{border:0;background:none;font-size:27px;cursor:pointer}.input,.area{width:100%;padding:13px 14px;border:1px solid #d9e1ee;border-radius:12px;margin:6px 0 11px;font-size:15px}.auth{min-height:100vh;background:linear-gradient(160deg,#06132e,#0c2553);color:#fff;padding:28px 20px;display:flex;align-items:center}.authbox{width:100%;background:#fff;color:#14213d;border-radius:24px;padding:22px;box-shadow:0 20px 60px #0005}.authlogo{display:block;width:92px;height:92px;border-radius:22px;margin:0 auto 10px}.tabs{display:flex;background:#eef2f8;border-radius:12px;padding:3px;margin:12px 0}.tabs button{flex:1;border:0;padding:10px;border-radius:9px;background:none;font-weight:800}.tabs .on{background:#fff;box-shadow:0 2px 8px #0001}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#07152f;color:#fff;padding:11px 15px;border-radius:12px;z-index:30;font-size:13px;max-width:90%;text-align:center}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px 5px;border-bottom:1px solid #edf0f5;text-align:left;font-size:13px}.admin{background:#fff7df;border:1px solid #f1d98d}.danger{background:#fff0f1;color:#b4232d}.small{font-size:11px}.center{text-align:center}.pill{padding:5px 8px;border-radius:9px;background:#edf3ff;font-size:11px;font-weight:800}.link{color:#1769ff;font-weight:800;cursor:pointer}.notice{padding:11px 13px;border-radius:12px;background:#eef5ff;margin:10px 0;font-size:12px}
</style></head><body><div id="root"></div><script>
const LOGO='logo.png';
const firebaseConfig={apiKey:'AIzaSyDGYbsgP-vyDP2QOOjVzH1gqgZ4i7viyTQ',authDomain:'skill-saga-cb695.firebaseapp.com',projectId:'skill-saga-cb695',storageBucket:'skill-saga-cb695.firebasestorage.app',messagingSenderId:'354189057486',appId:'1:354189057486:android:766d2f40945b738f8fdf9f'};
let firebaseReady=false,cloudUser=null,cloudDb=null,screen='home',quizState=null,authMode='login',local={content:[],users:{}};
try{firebase.initializeApp(firebaseConfig);cloudDb=firebase.firestore();firebaseReady=true}catch(e){console.warn(e)}
const fallbackQuiz={id:'daily-science',type:'daily',title:"Today's Science Challenge",category:'Science',difficulty:'Easy',xp:120,date:new Date().toISOString().slice(0,10),published:true,questions:[
['Which process allows green plants to prepare their own food?',['Respiration','Digestion','Photosynthesis','Transpiration'],2],
['Which gas is mainly used by plants during photosynthesis?',['Oxygen','Carbon dioxide','Nitrogen','Hydrogen'],1],
['What is the main source of energy for Earth?',['Moon','Wind','Sun','Soil'],2],
['Which part of a plant absorbs most water from soil?',['Flower','Roots','Fruit','Leaf'],1],
['Which organ pumps blood through the human body?',['Lungs','Brain','Heart','Kidney'],2]]};
const rewards=[{id:'first',name:'First Step',cost:0},{id:'streak7',name:'7 Day Streak',cost:500},{id:'champion',name:'Quiz Champion',cost:1000},{id:'master',name:'Skill Master',cost:2500}];
function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function key(){return cloudUser?'ss_'+cloudUser.uid:'ss_guest'}
function readLocal(){try{return JSON.parse(localStorage.getItem(key()))||{}}catch(e){return {}}}
function writeLocal(u){localStorage.setItem(key(),JSON.stringify(u))}
function freshUser(name,email){return{name,email,xp:0,streak:0,level:1,quizzes:0,accuracy:0,skills:[50,50,50,50],badges:[],history:[],coins:0,lastQuizDate:'',role:'learner'}}
function user(){if(!cloudUser)return null;let u=local.user||freshUser(cloudUser.displayName||cloudUser.email.split('@')[0],cloudUser.email);ensureUserData(u);if(typeof u.xp!=='number')u.xp=0;if(typeof u.quizzes!=='number')u.quizzes=0;if(typeof u.accuracy!=='number')u.accuracy=0;if(typeof u.streak!=='number')u.streak=0;if(typeof u.level!=='number')u.level=1;return u}
async function cloudUserDoc(){if(!cloudUser)return null;let s=await cloudDb.collection('users').doc(cloudUser.uid).get();return s.exists?s.data():null}
async function saveCloudUser(u){if(!cloudUser||!cloudDb)return;let data={...u,password:null,uid:cloudUser.uid,email:cloudUser.email,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};delete data.password;await cloudDb.collection('users').doc(cloudUser.uid).set(data,{merge:true})}
async function loadCloudContent(){if(!cloudDb)return;try{let snap=await cloudDb.collection('quizzes').where('published','==',true).get();local.content=snap.docs.map(d=>({id:d.id,...d.data()}));if(!local.content.length)local.content=[fallbackQuiz]}catch(e){local.content=[fallbackQuiz]}}
function daily(){let today=new Date().toISOString().slice(0,10);return local.content.find(x=>x.type==='daily'&&x.date===today)||local.content.find(x=>x.type==='daily')||fallbackQuiz}
async function leaderboardData(){
  let me=user();
  let arr=[];
  if(cloudDb){
    try{
      let s=await cloudDb.collection('users').orderBy('xp','desc').limit(20).get();
      arr=s.docs.map(d=>d.data());
    }catch(e){
      arr=Object.values(local.users||{});
    }
  }else{
    arr=Object.values(local.users||{});
  }

  if(me){
    let uid=cloudUser&&cloudUser.uid;
    let exists=arr.some(x=>(uid&&x.uid===uid)||(x.email&&me.email&&x.email===me.email));
    if(!exists)arr.push({...me,uid:uid||me.uid||''});
  }

  return arr.sort((a,b)=>(b.xp||0)-(a.xp||0)).slice(0,20);
}
async function rank(){let u=user();let arr=await leaderboardData();return 1+arr.filter(x=>(x.xp||0)>(u.xp||0)).length}
function shell(content){document.getElementById('root').innerHTML=`<div class="app"><header class="top"><div class="brand"><img src="${LOGO}"><b>Skill <span>Saga</span></b></div><button class="iconbtn" onclick="notifications()">🔔</button></header><main class="main">${content}</main><nav class="nav"><button data-s="home">⌂<span>Home</span></button><button data-s="play">▶<span>Play</span></button><button data-s="compete">🏆<span>Compete</span></button><button data-s="skills">◈<span>Skills</span></button><button data-s="profile">●<span>Profile</span></button></nav></div>`;document.querySelectorAll('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.s===screen);b.onclick=()=>go(b.dataset.s)})}
async function go(n){screen=n;if(n==='home')return home();if(n==='play')return play();if(n==='compete')return compete();if(n==='skills')return skills();if(n==='profile')return profile()}
async function home(){let u=user();if(!u)return loginScreen();let r=await rank();let d=daily();shell(`<div class="muted">Welcome back 👋</div><h1>Hi, ${esc(u.name)}!</h1><div class="muted">A smarter way to learn — one challenge at a time.</div><div class="stats"><div class="stat"><b>${u.xp}</b><small>XP</small></div><div class="stat"><b>${u.streak} 🔥</b><small>Streak</small></div><div class="stat"><b>#${r}</b><small>Rank</small></div></div><div class="hero"><small>TODAY'S MISSION</small><h2>${esc(d.title)}</h2><p>${d.questions.length} Questions • ${esc(d.difficulty||'Mixed')}</p><button class="btn light" onclick="startQuiz('${d.id}')">Start Challenge →</button></div><div class="section"><b>Your Skills</b><span class="link" onclick="go('skills')">View all</span></div><div class="skills">${[['➗','Numerical'],['🧪','Science'],['📖','English'],['🧠','Reasoning']].map((x,i)=>`<div class="skill">${x[0]}<b>${u.skills[i]}</b>${x[1]}</div>`).join('')}</div><div class="section"><b>Next milestone</b></div><div class="card"><b>Level ${u.level}</b><p class="muted">${u.xp%500}/500 XP toward the next level.</p><div class="bar"><i style="width:${(u.xp%500)/5}%"></i></div></div>`)}
function challengeDateKey(){
  return new Date().toISOString().slice(0,10);
}

function weekKey(){
  var d=new Date();
  var day=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()-day+1);
  return d.toISOString().slice(0,10);
}

function challengesScreen(){
  var d=daily();
  var u=ensureUserData(user());
  var today=challengeDateKey();
  var week=weekKey();

  var doneToday=(u.history||[]).some(function(x){
    return x.date && x.date.slice(0,10)===today;
  });

  var weeklyCount=(u.history||[]).filter(function(x){
    return x.date && x.date.slice(0,10)>=week;
  }).length;

  shell(
    '<div class="row"><h1>Challenges</h1><span>🎯</span></div>'+
    '<div class="muted">Build your skills through focused daily and weekly goals.</div>'+

    '<div class="section"><b>Daily Challenge</b></div>'+
    '<div class="hero">'+
      '<small>AVAILABLE TODAY</small>'+
      '<h2>'+esc(d.title)+'</h2>'+
      '<p>'+d.questions.length+' Questions • '+esc(d.difficulty||'Mixed')+'</p>'+
      '<span class="badge">'+(doneToday?'Completed today ✓':'Ready to play')+'</span>'+
      '<button class="btn light block" style="margin-top:12px" onclick="startQuiz(\''+d.id+'\')">'+
        (doneToday?'Practice Again →':'Start Daily Challenge →')+
      '</button>'+
    '</div>'+

    '<div class="section"><b>Weekly Challenge</b></div>'+
    '<div class="card">'+
      '<div class="row"><b>🏆 Weekly Skill Goal</b><span class="badge">'+weeklyCount+'/5</span></div>'+
      '<p class="muted">Complete 5 quizzes this week to strengthen your learning habit.</p>'+
      '<div class="bar"><i style="width:'+Math.min(100,weeklyCount*20)+'%"></i></div>'+
      '<p><b>'+Math.min(5,weeklyCount)+'/5</b> weekly challenges completed</p>'+
      (weeklyCount>=5?
        '<div class="notice">🎉 Weekly goal complete! Keep practicing for more XP.</div>':
        '<button class="btn gold block" onclick="startQuiz(\''+d.id+'\')">Continue Weekly Goal</button>')+
    '</div>'+

    '<div class="section"><b>Your Challenge Streak</b></div>'+
    '<div class="grid">'+
      '<div class="tile"><b>🔥 '+u.streak+'</b><small>Day streak</small></div>'+
      '<div class="tile"><b>'+u.quizzes+'</b><small>Total quizzes</small></div>'+
      '<div class="tile"><b>'+u.xp+'</b><small>Total XP</small></div>'+
      '<div class="tile"><b>🪙 '+(u.coins||0)+'</b><small>Coins</small></div>'+
    '</div>'
  );
}

function play(){shell(`<h1>Play</h1><div class="muted">Practice school subjects and real-world skills.</div><div class="card" style="margin-top:15px">
  <div class="row"><div><b>🎯 Daily & Weekly Challenges</b><div class="muted">Complete focused goals and build your streak.</div></div><button class="btn gold" onclick="challengesScreen()">Open</button></div>
</div>
<div class="section"><b>Learn & Practice</b></div><div class="grid">${[['➗','Maths'],['🧪','Science'],['📖','English'],['🌍','Social Science'],['🧠','Logic'],['⚡','Speed'],['🧩','Memory'],['🔤','Vocabulary']].map(x=>`<div class="tile" onclick="startQuiz('${daily().id}')"><span class="ico">${x[0]}</span><b>${x[1]}</b><small>Practice</small></div>`).join('')}</div><div class="section"><b>Daily goal</b></div><div class="card"><b>Complete one focused challenge</b><p class="muted">Build XP, improve accuracy and maintain your streak.</p><button class="btn" onclick="startQuiz('${daily().id}')">Practice now</button></div>`)}
async function compete(){let arr=await leaderboardData();shell(`<h1>Compete</h1><div class="muted">Healthy competition. Real improvement.</div><div class="card" style="margin-top:15px"><div class="row"><b>Today's Daily Challenge</b>🏆</div><p class="muted">Free participation • XP based on performance</p><button class="btn" onclick="startQuiz('${daily().id}')">Start Now</button></div><div class="section"><b>Weekly Championship</b></div><div class="card"><b>Weekly Skill Championship</b><p class="muted">Improve your score and climb the leaderboard.</p><span class="badge">No entry fee</span></div><div class="section"><b>Leaderboard</b></div>${leaderboard(arr)}`)}
function leaderboard(arr){
  var me=user();
  var list=(arr||[]).slice().sort(function(a,b){
    return (b.xp||0)-(a.xp||0);
  });

  var myIndex=-1;
  if(me){
    myIndex=list.findIndex(function(x){
      return (x.uid&&cloudUser&&x.uid===cloudUser.uid) ||
             (x.email&&x.email===me.email);
    });
  }

  var rows=list.slice(0,10).map(function(u,i){
    var medal=i===0?'🥇':(i===1?'🥈':(i===2?'🥉':String(i+1)));
    var mine=me && u.email===me.email;

    return '<tr style="'+(mine?'font-weight:700;background:#fff8df':'')+'">'+
      '<td>'+medal+'</td>'+
      '<td>'+esc(u.name||'Learner')+(mine?' <span class="badge">You</span>':'')+'</td>'+
      '<td>Lv '+(u.level||1)+'</td>'+
      '<td>'+(u.xp||0)+'</td>'+
      '<td>🔥 '+(u.streak||0)+'</td>'+
    '</tr>';
  }).join('');

  if(!rows){
    rows='<tr><td colspan="5" class="center muted">No leaderboard data yet.</td></tr>';
  }

  var myRank='';
  if(myIndex>=0){
    myRank='<div class="notice">🏆 Your current rank: <b>#'+(myIndex+1)+'</b> • '+(me.xp||0)+' XP</div>';
  }

  return '<div class="card">'+
    '<table class="table">'+
      '<tr><th>#</th><th>Learner</th><th>Level</th><th>XP</th><th>Streak</th></tr>'+
      rows+
    '</table>'+
    myRank+
  '</div>';
}


function skills(){let u=user();let names=['Numerical','Reasoning','Problem Solving','Speed','Accuracy','Memory','Vocabulary','Scientific Thinking'];let vals=[u.skills[0],u.skills[3],u.skills[0],u.skills[3],u.accuracy,u.skills[2],u.skills[1],u.skills[2]];shell(`<h1>My Skill DNA</h1><div class="muted">Your skills change as you learn and practice.</div><div class="card" style="margin-top:15px">${names.map((n,i)=>`<div style="margin:12px 0"><div class="row"><span>${n}</span><b>${vals[i]}</b></div><div class="bar"><i style="width:${vals[i]}%"></i></div></div>`).join('')}</div><div class="section"><b>Achievements & Rewards</b></div><div class="card">${u.badges.length?u.badges.map(x=>`<span class="badge">🏅 ${esc(x)}</span>`).join(''):'<span class="muted">Complete challenges to unlock badges.</span>'}</div><button class="btn gold block" onclick="rewardsScreen()">Open Rewards</button>`)}
function rewardsScreen(){
  var u=ensureUserData(user());

  var rewardList=[
    {name:'First Challenge',cost:0,icon:'🎯',text:'Complete your first quiz'},
    {name:'Quick Learner',cost:50,icon:'⚡',text:'Claim for 50 Skill Saga Coins'},
    {name:'Knowledge Builder',cost:100,icon:'📚',text:'Claim for 100 Skill Saga Coins'},
    {name:'Skill Master',cost:250,icon:'🏆',text:'Claim for 250 Skill Saga Coins'},
    {name:'Consistency Star',cost:500,icon:'⭐',text:'Claim for 500 Skill Saga Coins'}
  ];

  var html=rewardList.map(function(r){
    var unlocked=u.badges.includes(r.name);
    return '<div class="card" style="margin:10px 0">'+
      '<div class="row">'+
        '<div>'+
          '<b>'+r.icon+' '+esc(r.name)+'</b>'+
          '<div class="muted">'+esc(r.text)+'</div>'+
        '</div>'+
        '<button class="btn '+(unlocked?'':'gold')+'" onclick="claimReward(\''+r.name+'\','+r.cost+')">'+
          (unlocked?'Unlocked':r.cost+' 🪙')+
        '</button>'+
      '</div>'+
    '</div>';
  }).join('');

  shell(
    '<div class="row">'+
      '<button class="back" onclick="go(\'profile\')">‹</button>'+
      '<h1>Rewards</h1>'+
      '<span>🏅</span>'+
    '</div>'+
    '<div class="hero">'+
      '<small>SKILL SAGA COINS</small>'+
      '<h2>🪙 '+(u.coins||0)+'</h2>'+
      '<p>Earn coins by learning, practicing and completing challenges.</p>'+
    '</div>'+
    '<div class="section"><b>Achievement Rewards</b></div>'+
    html+
    '<div class="card" style="margin-top:15px">'+
      '<b>How to earn coins</b>'+
      '<p class="muted">Complete quizzes and maintain your learning streak. Skill Saga Coins are virtual in-app rewards and have no cash value.</p>'+
    '</div>'
  );
}


async function claimReward(name,cost){
  var u=ensureUserData(user());

  if(u.badges.includes(name)){
    return toast('Already unlocked');
  }

  if(cost>0 && (u.coins||0)<cost){
    return toast('Not enough Skill Saga Coins yet');
  }

  if(cost>0)u.coins-=cost;

  u.badges.push(name);
  await persistUser(u);

  toast('🏅 Achievement unlocked!');
  rewardsScreen();
}


function history(){
  var u=ensureUserData(user());
  var h=u.history||[];

  var rows='';
  if(!h.length){
    rows='<div class="card center" style="margin-top:15px"><div style="font-size:50px">📚</div><h3>No quiz history yet</h3><p class="muted">Complete your first challenge and your results will appear here.</p><button class="btn" onclick="go(\'play\')">Start Learning</button></div>';
  }else{
    rows=h.map(function(x){
      var d=new Date(x.date);
      var date=isNaN(d.getTime())?'':d.toLocaleDateString();
      return '<div class="card" style="margin:10px 0">'+
        '<div class="row"><b>'+esc(x.title||'Quiz')+'</b><span class="badge">'+date+'</span></div>'+
        '<p class="muted">'+x.score+'/'+x.total+' correct • '+x.accuracy+'% accuracy</p>'+
        '<div class="row"><span>XP earned</span><b>+'+(x.xp||0)+'</b></div>'+
      '</div>';
    }).join('');
  }

  shell(
    '<div class="row"><h1>Quiz History</h1><span>📚</span></div>'+
    '<div class="muted">Review your recent learning performance.</div>'+
    '<div class="section"><b>Recent Attempts</b></div>'+
    rows
  );
}

function profile(){
  var u=ensureUserData(user());
  var history=u.history||[];

  shell(
    '<h1>Profile</h1>'+
    '<div class="card center" style="margin-top:15px">'+
      '<div style="font-size:58px">👤</div>'+
      '<h2>'+esc(u.name)+'</h2>'+
      '<div class="muted">'+esc(u.email)+'</div>'+
      '<span class="badge">Level '+u.level+'</span>'+
      '<span class="badge">🔥 '+u.streak+'-day streak</span>'+
      '<span class="badge">⭐ '+u.xp+' XP</span>'+
      '<span class="badge">🪙 '+(u.coins||0)+' Coins</span>'+
    '</div>'+

    '<div class="section"><b>My Progress</b></div>'+
    '<div class="grid">'+
      '<div class="tile"><b>'+u.quizzes+'</b><small>Quizzes completed</small></div>'+
      '<div class="tile"><b>'+u.accuracy+'%</b><small>Overall accuracy</small></div>'+
      '<div class="tile"><b>'+u.level+'</b><small>Current level</small></div>'+
      '<div class="tile"><b>'+history.length+'</b><small>Recorded attempts</small></div>'+
    '</div>'+

    '<div class="section"><b>Learning</b></div>'+
    '<div class="card">'+

let s=quizState,x=s.c.questions[s.q];
if(window.skillSagaQuizTimer)clearInterval(window.skillSagaQuizTimer);
s.timeLeft=60;
shell(`<div class="row"><button class="back" onclick="go('home')">‹</button><b>${esc(s.c.title)}</b><span id="quizTimer">⏱ 60s</span></div><p class="muted">Question ${s.q+1} of ${s.c.questions.length}</p><div class="bar"><i style="width:${(s.q/s.c.questions.length)*100}%"></i></div><div class="card" style="margin-top:18px"><h2>${esc(x[0])}</h2>${x[1].map((o,i)=>`<button class="option" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>`);
window.skillSagaQuizTimer=setInterval(()=>{
if(!quizState)return;
quizState.timeLeft--;
let el=document.getElementById('quizTimer');
if(el)el.textContent='⏱ '+Math.max(0,quizState.timeLeft)+'s';
if(quizState.timeLeft<=0){
clearInterval(window.skillSagaQuizTimer);
if(!quizState.answered){
quizState.answered=true;
setTimeout(()=>{

quizState.q++;

},150);

},1000);

function answer(i){if(quizState.answered)return;quizState.answered=true;let x=quizState.c.questions[quizState.q],os=document.querySelectorAll('.option');if(i===x[2]){quizState.score++;os[i].classList.add('ok')}else{os[i].classList.add('no');os[x[2]].classList.add('ok')}setTimeout(()=>{if(quizState.q<quizState.c.questions.length-1){quizState.q++;quizState.answered=false;renderQuiz()}else finishQuiz()},450)}
async function finishQuiz(){let s=quizState,u=user(),pct=Math.round(s.score/s.c.questions.length*100),earned=Math.max(10,Math.round((s.c.xp||100)*(s.score/s.c.questions.length)));let today=new Date().toISOString().slice(0,10);if(u.lastQuizDate!==today){let yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);u.streak=(u.lastQuizDate===yesterday)?u.streak+1:1;u.lastQuizDate=today}u.xp+=earned;u.quizzes++;u.accuracy=Math.round(((u.accuracy*(u.quizzes-1))+pct)/u.quizzes);ensureUserData(u);

async function publishQuiz(){
  try{
    var title=document.getElementById('qt').value.trim();
    var cat=document.getElementById('qc').value.trim()||'General';
    var type=document.getElementById('qtype').value||'daily';
    var difficulty=document.getElementById('qdiff').value||'Medium';
    var date=document.getElementById('qd').value||new Date().toISOString().slice(0,10);
    var xp=Math.max(10,Math.min(500,Number(document.getElementById('qx').value)||100));

    var raw=document.getElementById('qq').value.split('\n')
      .map(function(x){return x.trim()})
      .filter(Boolean);

    if(!title)return toast('Enter a quiz title');
    if(!raw.length)return toast('Add at least one question');

    var qs=[];
    for(var i=0;i<raw.length;i++){
      try{
        var q=JSON.parse(raw[i]);
        if(!Array.isArray(q)||q.length!==3||typeof q[0]!=='string'||
           !Array.isArray(q[1])||q[1].length!==4||
           ![0,1,2,3].includes(q[2])){
          throw Error();
        }
        qs.push(q);
      }catch(e){
        return toast('Invalid question on line '+(i+1));
      }
    }

    if(!cloudDb||!cloudUser){
      return toast('Admin database is not connected');
    }

    var doc={
      type:type,
      title:title,
      category:cat,
      difficulty:difficulty,
      xp:xp,
      date:date,
      published:true,
      questions:qs,
      createdBy:cloudUser.uid,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    };

    await cloudDb.collection('quizzes').add(doc);
    await loadCloudContent();

    toast('Quiz published successfully');
    admin();

  }catch(e){
    toast(e.message||'Could not publish quiz');
  }
}


function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

window.skillSagaNavigate=function(page){
  page=String(page||'home').toLowerCase();

  var fn=null;
  if(page==='home' && typeof home==='function')fn=home;
  if(page==='play' && typeof play==='function')fn=play;
  if(page==='compete' && typeof compete==='function')fn=compete;
  if(page==='skills' && typeof skills==='function')fn=skills;
  if(page==='profile' && typeof profile==='function')fn=profile;
  if(page==='rewards' && typeof rewardsScreen==='function')fn=rewardsScreen;
  if(page==='progress' && typeof progress==='function')fn=progress;
  if(page==='history' && typeof history==='function')fn=history;
  if(page==='settings' && typeof settings==='function')fn=settings;
  if(page==='challenges' && typeof challengesScreen==='function')fn=challengesScreen;

  if(fn){
    screen=page;
    location.hash=page;
    return fn();
  }

  return toast('This section is not available yet');
};

window.go=function(page){
  return window.skillSagaNavigate(page);
};

async function boot(){if(!firebaseReady){loginScreen();return}firebase.auth().onAuthStateChanged(async fu=>{if(!fu){cloudUser=null;loginScreen();return}cloudUser=fu;try{let remote=await cloudUserDoc();local.user={...freshUser(fu.displayName||fu.email.split('@')[0],fu.email),...readLocal(),...(remote||{})};ensureUserData(local.user);if(!local.user.name)local.user.name=fu.displayName||fu.email.split('@')[0];await persistUser(local.user);await loadCloudContent();go('home')}catch(e){local.user={...freshUser(fu.displayName||fu.email.split('@')[0],fu.email),...readLocal()};await loadCloudContent();go('home')}})}
boot();
</script>
<script>

function ssUser(){
 try{
   if(typeof user==="function") return user();
 }catch(e){}
 return window.local?.user || {};
}

async function ssSave(u){
 try{
   if(typeof persistUser==="function") await persistUser(u);
 }catch(e){}
 try{
   local.user=u;
   localStorage.setItem("skillSaga",JSON.stringify(local));
 }catch(e){}
}

window.addSkillSagaCoins=async function(amount){
 let u=ssUser();
 u.coins=Number(u.coins||0)+Number(amount||0);
 await ssSave(u);
};

window.addQuizHistory=async function(record){
 let u=ssUser();
 u.quizHistory=Array.isArray(u.quizHistory)?u.quizHistory:[];
 u.quizHistory.unshift({
   ...record,
   id:Date.now(),
   date:new Date().toISOString()
 });
 u.quizHistory=u.quizHistory.slice(0,100);
 await ssSave(u);
};

window.showQuizHistory=function(){
 let u=ssUser();
 let h=Array.isArray(u.quizHistory)?u.quizHistory:[];
 let html='<div class="card"><h2>📚 Quiz History</h2>';
 if(!h.length){
   html+='<p class="muted">No quizzes completed yet. Start your first challenge!</p>';
 }else{
   html+=h.map(x=>`
   <div class="card" style="margin:10px 0;padding:14px">
     <b>${x.title||"Quiz"}</b>
     <div class="muted">${x.category||"General"} • ${x.score||0}/${x.total||0}</div>
     <div>⭐ ${x.xp||0} XP &nbsp; 🪙 ${x.coins||0} Coins</div>
     <small>${x.date?new Date(x.date).toLocaleString():""}</small>
   </div>`).join("");
 }
 html+='</div>';
 document.body.insertAdjacentHTML("beforeend",
 `<div id="ssHistoryOverlay" style="position:fixed;inset:0;background:#f7f8fc;z-index:99999;overflow:auto;padding:20px">
   <button class="btn" onclick="document.getElementById('ssHistoryOverlay').remove()">← Back</button>
   ${html}
 </div>`);
};

window.showSkillSagaRewards=function(){
 let u=ssUser();
 let coins=Number(u.coins||0);
 let claimed=Array.isArray(u.claimedRewards)?u.claimedRewards:[];
 let html=`<div class="card"><h2>🪙 Skill Saga Coins</h2>
 <h1>${coins}</h1>
 <p class="muted">Earn coins by learning and completing challenges.</p></div>`;

 html+=window.skillSagaRewards.map(r=>{
   let done=claimed.includes(r.id);
   let can=coins>=r.cost;
   return `<div class="card" style="margin:10px 0">
    <h3>${r.icon} ${r.name}</h3>
    <p class="muted">${r.desc}</p>
    <b>${r.cost===0?"FREE":r.cost+" 🪙"}</b>
    <button class="btn gold" ${done?"disabled":(!can?"disabled":"")}
      onclick="redeemSkillSagaReward('${r.id}')">
      ${done?"✓ Unlocked":(can?"Unlock":"Not enough Coins")}
    </button>
   </div>`;
 }).join("");

 html+=`<div class="card">
 <p class="muted">Coins are an in-app educational reward only. They cannot be withdrawn as cash and are not gambling credits.</p>
 </div>`;

 document.body.insertAdjacentHTML("beforeend",
 `<div id="ssRewardsOverlay" style="position:fixed;inset:0;background:#f7f8fc;z-index:99999;overflow:auto;padding:20px">
 <button class="btn" onclick="document.getElementById('ssRewardsOverlay').remove()">← Back</button>
 ${html}</div>`);
};

window.redeemSkillSagaReward=async function(id){
 let u=ssUser();
 let r=window.skillSagaRewards.find(x=>x.id===id);
 if(!r)return;
 u.coins=Number(u.coins||0);
 u.claimedRewards=Array.isArray(u.claimedRewards)?u.claimedRewards:[];
 u.badges=Array.isArray(u.badges)?u.badges:[];

 if(u.claimedRewards.includes(id))return;
 if(u.coins<r.cost){
   if(typeof toast==="function")toast("Not enough Skill Saga Coins");
   return;
 }

 u.coins-=r.cost;
 u.claimedRewards.push(id);
 if(!u.badges.includes(r.name))u.badges.push(r.name);
 await ssSave(u);

 if(typeof toast==="function")toast("🎉 Reward unlocked!");
 document.getElementById("ssRewardsOverlay")?.remove();
 window.showSkillSagaRewards();
};

window.deleteSkillSagaAccount=async function(){
 let u=ssUser();
 if(!confirm("Delete your Skill Saga account permanently? This cannot be undone."))return;

 try{
   if(window.firebaseReady && firebase.auth().currentUser){
     let cu=firebase.auth().currentUser;
     try{
       await firebase.firestore().collection("users").doc(cu.uid).delete();
     }catch(e){}
     await cu.delete();
   }
 }catch(e){
   if(typeof toast==="function")toast("Please log in again before deleting your account.");
   return;
 }

 try{localStorage.removeItem("skillSaga");}catch(e){}
 if(typeof logout==="function"){
   try{await logout();return}catch(e){}
 }
 location.reload();
};

/* Migrate existing users without destroying their data */
try{
 let u=ssUser();
 if(u && typeof u==="object"){
   if(typeof u.coins!=="number")u.coins=0;
   if(!Array.isArray(u.quizHistory))u.quizHistory=[];
   if(!Array.isArray(u.claimedRewards))u.claimedRewards=[];
   if(!Array.isArray(u.badges))u.badges=[];
   ssSave(u);
 }
}catch(e){}

/* Add a visible history/rewards utility where possible */
window.openSkillSagaHistory=window.showQuizHistory;
window.openSkillSagaRewards=window.showSkillSagaRewards;

})();
