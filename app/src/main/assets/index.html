<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152f"><title>Skill Saga</title>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#071127;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#14213d}.app{width:min(460px,100vw);min-height:100vh;margin:auto;background:#f7f9fd;padding-bottom:96px}.top{padding:calc(14px + env(safe-area-inset-top)) 17px 14px;display:flex;justify-content:space-between;align-items:center;background:#07152f;color:#fff;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:9px}.brand img{width:42px;height:42px;border-radius:12px;object-fit:cover}.brand b{font-size:20px}.brand b span{color:#e8b94f}.iconbtn{border:0;background:#ffffff12;color:#fff;border-radius:12px;padding:9px 11px}.main{padding:18px}.muted{color:#74819b;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat,.card,.tile{background:#fff;border-radius:18px;padding:15px;box-shadow:0 7px 24px #10204d12}.stat b{display:block;font-size:18px}.stat small{color:#7b88a0}.hero{background:linear-gradient(135deg,#0a2453,#1769ff 55%,#7047ef);color:#fff;border-radius:21px;padding:18px;margin:13px 0}.hero h2{margin:4px 0}.btn{border:0;border-radius:12px;padding:12px 17px;font-weight:850;cursor:pointer;background:#1769ff;color:#fff}.btn.gold{background:#e9b84d;color:#07152f}.btn.light{background:#fff;color:#1769ff}.btn.block{width:100%}.section{display:flex;justify-content:space-between;align-items:center;margin:19px 2px 9px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{cursor:pointer}.tile .ico{font-size:27px}.tile b{display:block;margin-top:6px}.skills{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.skill{text-align:center;background:#fff;border-radius:14px;padding:11px 3px;font-size:11px}.skill b{display:block;font-size:15px}.bar{height:8px;background:#e7ebf4;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#1769ff}.nav{position:fixed;bottom:0;width:min(460px,100vw);height:82px;padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid #e9edf4;display:flex;justify-content:space-around;align-items:center;z-index:10}.nav button{border:0;background:none;color:#7d89a1;font-size:11px;font-weight:800;min-width:0;flex:1;padding:4px 2px}.nav button.active{color:#1769ff}.nav span{display:block;font-size:19px;white-space:nowrap}.option{display:block;width:100%;padding:14px;margin:8px 0;border:1px solid #dce3ef;background:#fff;border-radius:13px;text-align:left;font-weight:650;cursor:pointer}.option.ok{background:#e9faf3;border-color:#18b978}.option.no{background:#fff0f1;border-color:#ef5b62}.badge{display:inline-block;padding:7px 9px;border-radius:9px;background:#fff3ca;margin:3px;font-size:11px;font-weight:800}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.back{border:0;background:none;font-size:27px;cursor:pointer}.input,.area{width:100%;padding:13px 14px;border:1px solid #d9e1ee;border-radius:12px;margin:6px 0 11px;font-size:15px}.auth{min-height:100vh;background:linear-gradient(160deg,#06132e,#0c2553);color:#fff;padding:28px 20px;display:flex;align-items:center}.authbox{width:100%;background:#fff;color:#14213d;border-radius:24px;padding:22px;box-shadow:0 20px 60px #0005}.authlogo{display:block;width:92px;height:92px;border-radius:22px;margin:0 auto 10px}.tabs{display:flex;background:#eef2f8;border-radius:12px;padding:3px;margin:12px 0}.tabs button{flex:1;border:0;padding:10px;border-radius:9px;background:none;font-weight:800}.tabs .on{background:#fff;box-shadow:0 2px 8px #0001}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#07152f;color:#fff;padding:11px 15px;border-radius:12px;z-index:30;font-size:13px;max-width:90%;text-align:center}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px 5px;border-bottom:1px solid #edf0f5;text-align:left;font-size:13px}.admin{background:#fff7df;border:1px solid #f1d98d}.danger{background:#fff0f1;color:#b4232d}.small{font-size:11px}.center{text-align:center}.pill{padding:5px 8px;border-radius:9px;background:#edf3ff;font-size:11px;font-weight:800}.link{color:#1769ff;font-weight:800;cursor:pointer}.notice{padding:11px 13px;border-radius:12px;background:#eef5ff;margin:10px 0;font-size:12px}
</style></head><body><div id="root"></div><script>
const LOGO='logo.png';
const firebaseConfig={apiKey:'AIzaSyDGYbsgP-vyDP2QOOjVzH1gqgZ4i7viyTQ',authDomain:'skill-saga-cb695.firebaseapp.com',projectId:'skill-saga-cb695',storageBucket:'skill-saga-cb695.firebasestorage.app',messagingSenderId:'354189057486',appId:'1:354189057486:android:766d2f40945b738f8fdf9f'};
let firebaseReady=false,cloudUser=null,cloudDb=null,screen='home',quizState=null,authMode='login',local={content:[],users:{}};
try{firebase.initializeApp(firebaseConfig);cloudDb=firebase.firestore();firebaseReady=true}catch(e){console.warn(e)}
const fallbackQuiz={id:'daily-science',type:'daily',title:"Today's Science Challenge",category:'Science',difficulty:'Easy',xp:120,date:new Date().toISOString().slice(0,10),published:true,questions:[
['Which process allows green plants to prepare their own food?',['Respiration','Digestion','Photosynthesis','Transpiration'],2],
['Which gas is mainly used by plants during photosynthesis?',['Oxygen','Carbon dioxide','Nitrogen','Hydrogen'],1],
['What is the main source of energy for Earth?',['Moon','Wind','Sun','Soil'],2],
['Which part of a plant absorbs most water from soil?',['Flower','Roots','Fruit','Leaf'],1],
['Which organ pumps blood through the human body?',['Lungs','Brain','Heart','Kidney'],2]]};
const rewards=[{id:'first',name:'First Step',cost:0},{id:'streak7',name:'7 Day Streak',cost:500},{id:'champion',name:'Quiz Champion',cost:1000},{id:'master',name:'Skill Master',cost:2500}];
function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function key(){return cloudUser?'ss_'+cloudUser.uid:'ss_guest'}
function readLocal(){try{return JSON.parse(localStorage.getItem(key()))||{}}catch(e){return {}}}
function writeLocal(u){localStorage.setItem(key(),JSON.stringify(u))}
function freshUser(name,email){return{name,email,xp:0,streak:0,level:1,quizzes:0,accuracy:0,skills:[50,50,50,50],badges:[],lastQuizDate:'',role:'learner'}}
function user(){if(!cloudUser)return null;return local.user||freshUser(cloudUser.displayName||cloudUser.email.split('@')[0],cloudUser.email)}
async function cloudUserDoc(){if(!cloudUser)return null;let s=await cloudDb.collection('users').doc(cloudUser.uid).get();return s.exists?s.data():null}
async function saveCloudUser(u){if(!cloudUser||!cloudDb)return;let data={...u,password:null,uid:cloudUser.uid,email:cloudUser.email,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};delete data.password;await cloudDb.collection('users').doc(cloudUser.uid).set(data,{merge:true})}
async function loadCloudContent(){if(!cloudDb)return;try{let snap=await cloudDb.collection('quizzes').where('published','==',true).get();local.content=snap.docs.map(d=>({id:d.id,...d.data()}));if(!local.content.length)local.content=[fallbackQuiz]}catch(e){local.content=[fallbackQuiz]}}
function daily(){let today=new Date().toISOString().slice(0,10);return local.content.find(x=>x.type==='daily'&&x.date===today)||local.content.find(x=>x.type==='daily')||fallbackQuiz}
async function leaderboardData(){if(!cloudDb)return Object.values(local.users||{});try{let s=await cloudDb.collection('users').orderBy('xp','desc').limit(20).get();return s.docs.map(d=>d.data())}catch(e){return []}}
async function rank(){let u=user();let arr=await leaderboardData();return 1+arr.filter(x=>(x.xp||0)>(u.xp||0)).length}
function shell(content){document.getElementById('root').innerHTML=`<div class="app"><header class="top"><div class="brand"><img src="${LOGO}"><b>Skill <span>Saga</span></b></div><button class="iconbtn" onclick="notifications()">🔔</button></header><main class="main">${content}</main><nav class="nav"><button data-s="home">⌂<span>Home</span></button><button data-s="play">▶<span>Play</span></button><button data-s="compete">🏆<span>Compete</span></button><button data-s="skills">◈<span>Skills</span></button><button data-s="profile">●<span>Profile</span></button></nav></div>`;document.querySelectorAll('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.s===screen);b.onclick=()=>go(b.dataset.s)})}
async function go(n){screen=n;if(n==='home')return home();if(n==='play')return play();if(n==='compete')return compete();if(n==='skills')return skills();if(n==='profile')return profile()}
async function home(){let u=user();if(!u)return loginScreen();let r=await rank();let d=daily();shell(`<div class="muted">Welcome back 👋</div><h1>Hi, ${esc(u.name)}!</h1><div class="muted">A smarter way to learn — one challenge at a time.</div><div class="stats"><div class="stat"><b>${u.xp}</b><small>XP</small></div><div class="stat"><b>${u.streak} 🔥</b><small>Streak</small></div><div class="stat"><b>#${r}</b><small>Rank</small></div></div><div class="hero"><small>TODAY'S MISSION</small><h2>${esc(d.title)}</h2><p>${d.questions.length} Questions • ${esc(d.difficulty||'Mixed')}</p><button class="btn light" onclick="startQuiz('${d.id}')">Start Challenge →</button></div><div class="section"><b>Your Skills</b><span class="link" onclick="go('skills')">View all</span></div><div class="skills">${[['➗','Numerical'],['🧪','Science'],['📖','English'],['🧠','Reasoning']].map((x,i)=>`<div class="skill">${x[0]}<b>${u.skills[i]}</b>${x[1]}</div>`).join('')}</div><div class="section"><b>Next milestone</b></div><div class="card"><b>Level ${u.level}</b><p class="muted">${u.xp%500}/500 XP toward the next level.</p><div class="bar"><i style="width:${(u.xp%500)/5}%"></i></div></div>`)}
function play(){shell(`<h1>Play</h1><div class="muted">Practice school subjects and real-world skills.</div><div class="section"><b>Learn & Practice</b></div><div class="grid">${[['➗','Maths'],['🧪','Science'],['📖','English'],['🌍','Social Science'],['🧠','Logic'],['⚡','Speed'],['🧩','Memory'],['🔤','Vocabulary']].map(x=>`<div class="tile" onclick="startQuiz('${daily().id}')"><span class="ico">${x[0]}</span><b>${x[1]}</b><small>Practice</small></div>`).join('')}</div><div class="section"><b>Daily goal</b></div><div class="card"><b>Complete one focused challenge</b><p class="muted">Build XP, improve accuracy and maintain your streak.</p><button class="btn" onclick="startQuiz('${daily().id}')">Practice now</button></div>`)}
async function compete(){let arr=await leaderboardData();shell(`<h1>Compete</h1><div class="muted">Healthy competition. Real improvement.</div><div class="card" style="margin-top:15px"><div class="row"><b>Today's Challenge</b>🏆</div><p class="muted">Free participation • XP based on performance</p><button class="btn" onclick="startQuiz('${daily().id}')">Start Now</button></div><div class="section"><b>Weekly Championship</b></div><div class="card"><b>Weekly Skill Championship</b><p class="muted">Improve your score and climb the leaderboard.</p><span class="badge">No entry fee</span></div><div class="section"><b>Leaderboard</b></div>${leaderboard(arr)}`)}
function leaderboard(arr){return `<div class="card"><table class="table"><tr><th>#</th><th>Learner</th><th>XP</th></tr>${arr.slice(0,10).map((u,i)=>`<tr><td>${i+1}</td><td>${esc(u.name||'Learner')}</td><td>${u.xp||0}</td></tr>`).join('')}</table></div>`}
function skills(){let u=user();let names=['Numerical','Reasoning','Problem Solving','Speed','Accuracy','Memory','Vocabulary','Scientific Thinking'];let vals=[u.skills[0],u.skills[3],u.skills[0],u.skills[3],u.accuracy,u.skills[2],u.skills[1],u.skills[2]];shell(`<h1>My Skill DNA</h1><div class="muted">Your skills change as you learn and practice.</div><div class="card" style="margin-top:15px">${names.map((n,i)=>`<div style="margin:12px 0"><div class="row"><span>${n}</span><b>${vals[i]}</b></div><div class="bar"><i style="width:${vals[i]}%"></i></div></div>`).join('')}</div><div class="section"><b>Achievements & Rewards</b></div><div class="card">${u.badges.length?u.badges.map(x=>`<span class="badge">🏅 ${esc(x)}</span>`).join(''):'<span class="muted">Complete challenges to unlock badges.</span>'}</div><button class="btn gold block" onclick="rewardsScreen()">Open Rewards</button>`)}
function rewardsScreen(){let u=user();shell(`<div class="row"><button class="back" onclick="go('skills')">‹</button><h1>Rewards</h1><span></span></div><div class="hero"><small>YOUR BALANCE</small><h2>${u.xp} XP</h2><p>Use XP to unlock achievement badges.</p></div>${rewards.map(r=>`<div class="card" style="margin:10px 0"><div class="row"><div><b>🏅 ${r.name}</b><div class="muted">${r.cost===0?'Earn by completing your first challenge':r.cost+' XP to unlock'}</div></div><button class="btn ${u.badges.includes(r.name)?'':'gold'}" onclick="claimReward('${r.id}')">${u.badges.includes(r.name)?'Unlocked':r.cost?'Unlock':'Earn'}</button></div></div>`).join('')}`)}
async function claimReward(id){let u=user(),r=rewards.find(x=>x.id===id);if(u.badges.includes(r.name))return;if(r.cost&&u.xp<r.cost)return toast('Not enough XP yet');if(r.cost)u.xp-=r.cost;u.badges.push(r.name);await persistUser(u);toast('Achievement unlocked!');rewardsScreen()}
function profile(){let u=user();shell(`<h1>Profile</h1><div class="card center" style="margin-top:15px"><div style="font-size:58px">👤</div><h2>${esc(u.name)}</h2><div class="muted">${esc(u.email)}</div><span class="badge">Level ${u.level}</span><span class="badge">🔥 ${u.streak}-day streak</span><span class="badge">⭐ ${u.xp} XP</span></div><div class="section"><b>My progress</b></div><div class="grid"><div class="tile"><b>${u.quizzes}</b><small>Quizzes completed</small></div><div class="tile"><b>${u.accuracy}%</b><small>Accuracy</small></div></div>${u.role==='admin'?'<div class="section"><b>Administration</b></div><div class="card admin"><p class="muted">Manage quizzes and publish daily content.</p><button class="btn gold" onclick="admin()">Open Admin Console</button></div>':''}<div class="section"><b>Account</b></div><div class="card"><button class="btn block" onclick="logout()">Log out</button><button class="btn danger block" style="margin-top:8px" onclick="deleteAccount()">Delete account</button></div>`)}
function notifications(){toast('Your daily challenge is ready!')}
function startQuiz(id){let c=local.content.find(x=>x.id===id)||daily();quizState={c,q:0,score:0,answered:false};renderQuiz()}
function renderQuiz(){let s=quizState,x=s.c.questions[s.q];shell(`<div class="row"><button class="back" onclick="go('home')">‹</button><b>${esc(s.c.title)}</b><span>⏱</span></div><p class="muted">Question ${s.q+1} of ${s.c.questions.length}</p><div class="bar"><i style="width:${(s.q/s.c.questions.length)*100}%"></i></div><div class="card" style="margin-top:18px"><h2>${esc(x[0])}</h2>${x[1].map((o,i)=>`<button class="option" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div>`)}
function answer(i){if(quizState.answered)return;quizState.answered=true;let x=quizState.c.questions[quizState.q],os=document.querySelectorAll('.option');if(i===x[2]){quizState.score++;os[i].classList.add('ok')}else{os[i].classList.add('no');os[x[2]].classList.add('ok')}setTimeout(()=>{if(quizState.q<quizState.c.questions.length-1){quizState.q++;quizState.answered=false;renderQuiz()}else finishQuiz()},450)}
async function finishQuiz(){let s=quizState,u=user(),pct=Math.round(s.score/s.c.questions.length*100),earned=Math.max(10,Math.round((s.c.xp||100)*(s.score/s.c.questions.length)));let today=new Date().toISOString().slice(0,10);if(u.lastQuizDate!==today){let yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);u.streak=(u.lastQuizDate===yesterday)?u.streak+1:1;u.lastQuizDate=today}u.xp+=earned;u.quizzes++;u.accuracy=Math.round(((u.accuracy*(u.quizzes-1))+pct)/u.quizzes);u.level=1+Math.floor(u.xp/500);if(pct>=80&&!u.badges.includes('Most Improved'))u.badges.push('Most Improved');if(u.streak>=7&&!u.badges.includes('7 Day Streak'))u.badges.push('7 Day Streak');await persistUser(u);shell(`<div class="center" style="padding-top:25px"><div style="font-size:70px">🏆</div><h1>Challenge Complete!</h1><div class="muted">Great work. Keep building your skills.</div><div class="card" style="margin-top:18px"><h1>${s.score}/${s.c.questions.length}</h1><div class="grid"><div>Accuracy<br><b>${pct}%</b></div><div>XP Earned<br><b>+${earned}</b></div></div><p class="muted">Your progress has been saved.</p></div><button class="btn" style="margin-top:14px" onclick="go('skills')">View Skill DNA</button></div>`)}
function loginScreen(){document.getElementById('root').innerHTML=`<div class="auth"><div class="authbox"><img class="authlogo" src="${LOGO}"><h1 class="center">Skill Saga</h1><p class="center muted">A smarter way to learn</p><div class="tabs"><button class="${authMode==='login'?'on':''}" onclick="authMode='login';loginScreen()">Login</button><button class="${authMode==='signup'?'on':''}" onclick="authMode='signup';loginScreen()">Sign up</button></div>${authMode==='login'?`<input id="email" class="input" type="email" autocomplete="email" placeholder="Email"><input id="password" class="input" type="password" autocomplete="current-password" placeholder="Password"><button class="btn block" onclick="login()">Login</button><button class="btn light block" style="margin-top:8px" onclick="resetPassword()">Forgot password?</button>`:`<input id="name" class="input" autocomplete="name" placeholder="Your name"><input id="email" class="input" type="email" autocomplete="email" placeholder="Email"><input id="password" class="input" type="password" autocomplete="new-password" placeholder="Password (6+ characters)"><button class="btn block" onclick="signup()">Create account</button>`}<div class="notice">Skill Saga uses Firebase Authentication to keep your account secure. Your learning progress is synced to the cloud when online.</div></div></div>`}
async function login(){let e=document.getElementById('email').value.trim().toLowerCase(),p=document.getElementById('password').value;if(!e||!p)return toast('Enter email and password');if(!firebaseReady)return toast('Firebase is not connected');try{await firebase.auth().signInWithEmailAndPassword(e,p)}catch(err){toast(err.code==='auth/invalid-credential'?'Email or password is incorrect':(err.message||'Login failed'))}}
async function signup(){let n=document.getElementById('name').value.trim(),e=document.getElementById('email').value.trim().toLowerCase(),p=document.getElementById('password').value;if(!n||!e||p.length<6)return toast('Enter your name, email and a 6+ character password');if(!firebaseReady)return toast('Firebase is not connected');try{let cred=await firebase.auth().createUserWithEmailAndPassword(e,p);await cred.user.updateProfile({displayName:n})}catch(err){toast(err.code==='auth/email-already-in-use'?'Account already exists':(err.message||'Sign up failed'))}}
async function resetPassword(){let e=document.getElementById('email').value.trim().toLowerCase();if(!e)return toast('Enter your email first');try{await firebase.auth().sendPasswordResetEmail(e);toast('Password reset email sent')}catch(err){toast(err.message||'Could not send reset email')}}
async function logout(){try{if(firebaseReady)await firebase.auth().signOut()}catch(e){ }cloudUser=null;local={content:[],users:{}};loginScreen()}
async function deleteAccount(){if(!cloudUser)return;if(!confirm('Delete your Skill Saga account? This cannot be undone.'))return;try{await cloudDb.collection('users').doc(cloudUser.uid).delete();await cloudUser.delete();toast('Account deleted');}catch(e){toast('Please sign in again before deleting the account.')}}
async function persistUser(u){local.user=u;writeLocal(u);try{await saveCloudUser(u)}catch(e){console.warn('Cloud save failed',e)}}
function admin(){let u=user();if(!u||u.role!=='admin')return toast('Admin access is not enabled for this account');document.getElementById('root').innerHTML=`<div class="app"><header class="top"><div class="brand"><img src="${LOGO}"><b>Skill <span>Saga</span></b></div><button class="iconbtn" onclick="go('profile')">Back</button></header><main class="main"><h1>Admin Console</h1><div class="card admin"><b>Content Manager</b><p class="muted">Create quizzes and publish them to learners.</p><button class="btn gold" onclick="adminQuizForm()">+ New Quiz</button></div><div class="section"><b>Published content</b></div>${local.content.map(x=>`<div class="card" style="margin:8px 0"><b>${esc(x.title)}</b><div class="muted">${esc(x.category||'General')} • ${(x.questions||[]).length} questions • ${x.xp||100} XP</div></div>`).join('')}<div class="section"><b>Admin note</b></div><div class="notice">For production, only accounts with the Firebase users/{uid} role set to admin should be able to publish content.</div></main></div>`}
function adminQuizForm(){document.getElementById('root').innerHTML=`<div class="app"><main class="main"><div class="row"><button class="back" onclick="admin()">‹</button><h2>Create Quiz</h2><span></span></div><div class="card"><input id="qt" class="input" placeholder="Quiz title"><input id="qc" class="input" placeholder="Category"><input id="qd" class="input" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="qx" class="input" type="number" min="10" max="500" value="100" placeholder="XP"><p class="small muted">One JSON question per line: [question,[option A,option B,option C,option D],correctIndex].</p><textarea id="qq" class="area" rows="10" placeholder='["2+2 = ?",["3","4","5","6"],1]'></textarea><button class="btn block" onclick="publishQuiz()">Publish Quiz</button></div></main></div>`}
async function publishQuiz(){try{let title=document.getElementById('qt').value.trim(),cat=document.getElementById('qc').value.trim()||'General',date=document.getElementById('qd').value||new Date().toISOString().slice(0,10),xp=Math.max(10,Math.min(500,Number(document.getElementById('qx').value)||100)),lines=document.getElementById('qq').value.split('\n').map(x=>x.trim()).filter(Boolean),qs=lines.map(JSON.parse);if(!title||!qs.length||qs.some(x=>!Array.isArray(x)||x.length!==3||!Array.isArray(x[1])||x[1].length!==4||![0,1,2,3].includes(x[2])))throw Error();let doc={type:'daily',title,category:cat,difficulty:'Mixed',xp,date,published:true,questions:qs,createdBy:cloudUser.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()};await cloudDb.collection('quizzes').add(doc);await loadCloudContent();toast('Quiz published');admin()}catch(e){toast(e.message||'Could not publish quiz')}}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function boot(){if(!firebaseReady){loginScreen();return}firebase.auth().onAuthStateChanged(async fu=>{if(!fu){cloudUser=null;loginScreen();return}cloudUser=fu;try{let remote=await cloudUserDoc();local.user={...freshUser(fu.displayName||fu.email.split('@')[0],fu.email),...readLocal(),...(remote||{})};if(!local.user.name)local.user.name=fu.displayName||fu.email.split('@')[0];await persistUser(local.user);await loadCloudContent();go('home')}catch(e){local.user={...freshUser(fu.displayName||fu.email.split('@')[0],fu.email),...readLocal()};await loadCloudContent();go('home')}})}
boot();
</script>
<script>
/* ===== SKILL SAGA FINAL CORE UPGRADE ===== */
(function(){

window.skillSagaRewards=[
 {id:"first",name:"First Step",cost:0,icon:"🌟",desc:"Complete your first challenge"},
 {id:"streak7",name:"7 Day Streak",cost:500,icon:"🔥",desc:"Maintain a 7-day learning streak"},
 {id:"champion",name:"Quiz Champion",cost:1000,icon:"🏆",desc:"Complete quizzes and unlock the badge"},
 {id:"master",name:"Skill Master",cost:2500,icon:"🥇",desc:"Reach Skill Master level"},
 {id:"ebook",name:"Educational E-book",cost:5000,icon:"📚",desc:"Sponsored educational e-book when available"},
 {id:"stationery",name:"Stationery Reward",cost:10000,icon:"✏️",desc:"Sponsored stationery reward when available"}
];

function ssUser(){
 try{
   if(typeof user==="function") return user();
 }catch(e){}
 return window.local?.user || {};
}

async function ssSave(u){
 try{
   if(typeof persistUser==="function") await persistUser(u);
 }catch(e){}
 try{
   local.user=u;
   localStorage.setItem("skillSaga",JSON.stringify(local));
 }catch(e){}
}

window.addSkillSagaCoins=async function(amount){
 let u=ssUser();
 u.coins=Number(u.coins||0)+Number(amount||0);
 await ssSave(u);
};

window.addQuizHistory=async function(record){
 let u=ssUser();
 u.quizHistory=Array.isArray(u.quizHistory)?u.quizHistory:[];
 u.quizHistory.unshift({
   ...record,
   id:Date.now(),
   date:new Date().toISOString()
 });
 u.quizHistory=u.quizHistory.slice(0,100);
 await ssSave(u);
};

window.showQuizHistory=function(){
 let u=ssUser();
 let h=Array.isArray(u.quizHistory)?u.quizHistory:[];
 let html='<div class="card"><h2>📚 Quiz History</h2>';
 if(!h.length){
   html+='<p class="muted">No quizzes completed yet. Start your first challenge!</p>';
 }else{
   html+=h.map(x=>`
   <div class="card" style="margin:10px 0;padding:14px">
     <b>${x.title||"Quiz"}</b>
     <div class="muted">${x.category||"General"} • ${x.score||0}/${x.total||0}</div>
     <div>⭐ ${x.xp||0} XP &nbsp; 🪙 ${x.coins||0} Coins</div>
     <small>${x.date?new Date(x.date).toLocaleString():""}</small>
   </div>`).join("");
 }
 html+='</div>';
 document.body.insertAdjacentHTML("beforeend",
 `<div id="ssHistoryOverlay" style="position:fixed;inset:0;background:#f7f8fc;z-index:99999;overflow:auto;padding:20px">
   <button class="btn" onclick="document.getElementById('ssHistoryOverlay').remove()">← Back</button>
   ${html}
 </div>`);
};

window.showSkillSagaRewards=function(){
 let u=ssUser();
 let coins=Number(u.coins||0);
 let claimed=Array.isArray(u.claimedRewards)?u.claimedRewards:[];
 let html=`<div class="card"><h2>🪙 Skill Saga Coins</h2>
 <h1>${coins}</h1>
 <p class="muted">Earn coins by learning and completing challenges.</p></div>`;

 html+=window.skillSagaRewards.map(r=>{
   let done=claimed.includes(r.id);
   let can=coins>=r.cost;
   return `<div class="card" style="margin:10px 0">
    <h3>${r.icon} ${r.name}</h3>
    <p class="muted">${r.desc}</p>
    <b>${r.cost===0?"FREE":r.cost+" 🪙"}</b>
    <button class="btn gold" ${done?"disabled":(!can?"disabled":"")}
      onclick="redeemSkillSagaReward('${r.id}')">
      ${done?"✓ Unlocked":(can?"Unlock":"Not enough Coins")}
    </button>
   </div>`;
 }).join("");

 html+=`<div class="card">
 <p class="muted">Coins are an in-app educational reward only. They cannot be withdrawn as cash and are not gambling credits.</p>
 </div>`;

 document.body.insertAdjacentHTML("beforeend",
 `<div id="ssRewardsOverlay" style="position:fixed;inset:0;background:#f7f8fc;z-index:99999;overflow:auto;padding:20px">
 <button class="btn" onclick="document.getElementById('ssRewardsOverlay').remove()">← Back</button>
 ${html}</div>`);
};

window.redeemSkillSagaReward=async function(id){
 let u=ssUser();
 let r=window.skillSagaRewards.find(x=>x.id===id);
 if(!r)return;
 u.coins=Number(u.coins||0);
 u.claimedRewards=Array.isArray(u.claimedRewards)?u.claimedRewards:[];
 u.badges=Array.isArray(u.badges)?u.badges:[];

 if(u.claimedRewards.includes(id))return;
 if(u.coins<r.cost){
   if(typeof toast==="function")toast("Not enough Skill Saga Coins");
   return;
 }

 u.coins-=r.cost;
 u.claimedRewards.push(id);
 if(!u.badges.includes(r.name))u.badges.push(r.name);
 await ssSave(u);

 if(typeof toast==="function")toast("🎉 Reward unlocked!");
 document.getElementById("ssRewardsOverlay")?.remove();
 window.showSkillSagaRewards();
};

window.deleteSkillSagaAccount=async function(){
 let u=ssUser();
 if(!confirm("Delete your Skill Saga account permanently? This cannot be undone."))return;

 try{
   if(window.firebaseReady && firebase.auth().currentUser){
     let cu=firebase.auth().currentUser;
     try{
       await firebase.firestore().collection("users").doc(cu.uid).delete();
     }catch(e){}
     await cu.delete();
   }
 }catch(e){
   if(typeof toast==="function")toast("Please log in again before deleting your account.");
   return;
 }

 try{localStorage.removeItem("skillSaga");}catch(e){}
 if(typeof logout==="function"){
   try{await logout();return}catch(e){}
 }
 location.reload();
};

/* Migrate existing users without destroying their data */
try{
 let u=ssUser();
 if(u && typeof u==="object"){
   if(typeof u.coins!=="number")u.coins=0;
   if(!Array.isArray(u.quizHistory))u.quizHistory=[];
   if(!Array.isArray(u.claimedRewards))u.claimedRewards=[];
   if(!Array.isArray(u.badges))u.badges=[];
   ssSave(u);
 }
}catch(e){}

/* Add a visible history/rewards utility where possible */
window.openSkillSagaHistory=window.showQuizHistory;
window.openSkillSagaRewards=window.showSkillSagaRewards;

})();
</script>
</body></html>
